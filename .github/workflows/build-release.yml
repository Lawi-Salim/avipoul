name: Build & Release Avipoul

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable corepack (yarn)
        run: corepack enable

      - name: Install frontend deps
        run: yarn install --frozen-lockfile

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build installer (Tauri)
        run: npm run tauri:build

      - name: Rename setup -> Avipoul_<version>_x64-setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "src-tauri/target/release/bundle/nsis"
          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $target = Get-ChildItem $dir -Filter "*_x64-setup.exe" |
            Where-Object { $_.Name -like "AVIPOUL_${version}_*" } |
            Select-Object -First 1
          if ($null -eq $target) { throw "Aucun setup 'AVIPOUL_${version}_*_x64-setup.exe' dans $dir" }
          $new = $target.Name -replace '^AVIPOUL_', 'Avipoul_'
          if ($new -eq $target.Name) {
            Write-Host "Nom déjà correct : $($target.Name)"
          } else {
            $dest = Join-Path $dir $new
            if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Force }
            $done = $false
            for ($i = 1; $i -le 5; $i++) {
              try {
                Rename-Item -LiteralPath $target.FullName -NewName $new -ErrorAction Stop
                $done = $true
                break
              } catch {
                if ($i -lt 5) { Start-Sleep -Seconds 2 }
              }
            }
            if (-not $done) { throw "Échec du renommage : $($target.Name) (fichier verrouillé ?)" }
            Write-Host "Renommé : $($target.Name) -> $new"
          }
          Get-ChildItem $dir -Filter "*.exe" | ForEach-Object { Write-Host "NSIS OK : $($_.Name)" }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/src-tauri/target/release/bundle/nsis/*_x64-setup.exe
          generate_release_notes: true
