name: Build & Release Avipoul

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lire la version depuis tauri.conf.json
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable corepack (yarn)
        run: corepack enable

      - name: Install frontend deps
        run: yarn install --frozen-lockfile

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build installer (Tauri)
        run: npm run tauri:build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Avipoul v${{ steps.version.outputs.version }}
          body: |
            ## Avipoul v${{ steps.version.outputs.version }}

            ### Fonctionnalités
            - **Phases du cycle** : suivi en 6 phases (Broyage, Accouvage, Éclosion, Poussinière, Commercialisation, Nettoyage), durées paramétrables, passage de phase manuel avec blocage, traçabilité (qui, quand)
            - **Notifications** : cloche dans l'en-tête avec menu déroulant, alertes (phase bloquée, cycle en retard, tâches, alertes sanitaires), actualisation manuelle et automatique (60 s)
            - **Validations** : workflow de validation des actions sensibles, rejet motivé, auteur (created_by) enregistré
            - **Recherche** : module multi-critères (cycles, stocks, clients)

            ### CI/CD
            - Installateur Windows publié automatiquement
            - Backend déployé automatiquement sur le serveur Datasas (runner self-hosted)
            - Migrations de base de données exécutées au déploiement

            **Installateur :** `Avipoul_${{ steps.version.outputs.version }}_x64-setup.exe` (joint à cette release)
          files: frontend/src-tauri/target/release/bundle/nsis/*_x64-setup.exe
